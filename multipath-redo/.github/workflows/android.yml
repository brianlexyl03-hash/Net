name: Android CI and release artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Android source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: gradle lintDebug --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload debug APK for device QA
        uses: actions/upload-artifact@v4
        with:
          name: multipath-mobile-${{ github.sha }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release-bundle:
    name: Build Play Store AAB (unsigned)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run release checks
        run: gradle testDebugUnitTest lintRelease bundleRelease --stacktrace
      - name: Upload release bundle for signing and review
        uses: actions/upload-artifact@v4
        with:
          name: multipath-mobile-${{ github.ref_name }}-unsigned-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
