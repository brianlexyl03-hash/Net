name: Android CI and downloadable APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Android source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Unit test coverage report
        continue-on-error: true
        run: gradle createDebugUnitTestCoverageReport --stacktrace
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/coverage
          if-no-files-found: ignore
          retention-days: 14
      - name: Run Android lint
        run: gradle lintDebug --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload debug APK for device QA
        uses: actions/upload-artifact@v4
        with:
          name: multipath-mobile-${{ github.sha }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  publish-apk:
    name: Publish directly downloadable APK
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle assembleDebug --stacktrace
      - name: Publish APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.sha }}
          name: MultiPath Android build ${{ github.sha }}
          body: "Installable debug APK for device testing. Not Play Store production-signed."
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

  release-bundle:
    name: Build Play Store AAB (unsigned)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run release checks
        run: gradle testDebugUnitTest lintRelease bundleRelease --stacktrace
      - name: Upload release bundle for signing and review
        uses: actions/upload-artifact@v4
        with:
          name: multipath-mobile-${{ github.ref_name }}-unsigned-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
